services:
  register:
    # build: . means `docker compose up -d --build` actually rebuilds.
    # Without it, --build is silently a no-op and you keep running the
    # old image while believing you deployed.
    build: .
    image: register:latest
    pull_policy: never
    container_name: register
    restart: unless-stopped
    # Run as your user, not root. The container writes into a synced
    # vault; root-owned files there cause permission trouble for
    # Syncthing and for editing in Obsidian. Check yours: id -u; id -g
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-5557}:5000"
    volumes:
      # The vault is the entire database — must be writable.
      # Set VAULT_HOST_PATH in .env to your Obsidian vault.
      - ${VAULT_HOST_PATH:?set VAULT_HOST_PATH in .env}:/vault
    environment:
      - LOCAL_AI_MAX_INPUT_TOKENS=${LOCAL_AI_MAX_INPUT_TOKENS:-8000}
      - LOCAL_AI_MAX_SOURCE_DOCS=${LOCAL_AI_MAX_SOURCE_DOCS:-12}
      - LARGE_PROJECT_BATCH_DOCS=${LARGE_PROJECT_BATCH_DOCS:-6}
      - LARGE_PROJECT_BATCH_TOKENS=${LARGE_PROJECT_BATCH_TOKENS:-5000}
      - VAULT_PATH=/vault
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - OBSIDIAN_VAULT_NAME=${OBSIDIAN_VAULT_NAME:-Obsidian}
      - TZ=${TZ:-Europe/London}
      # Legacy settings; ordinary checkpoint import and compression never use Ollama.
      - SUMMARY_BACKEND=${SUMMARY_BACKEND:-local}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - LOCAL_CHAT_MODEL=${LOCAL_CHAT_MODEL:-qwen3:30b-a3b}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-24576}
      # Legacy compressor settings; upload compression remains deterministic.
      - COMPRESS_MODEL=${COMPRESS_MODEL:-llama3.1:8b}
      - COMPRESS_NUM_CTX=${COMPRESS_NUM_CTX:-8192}
      - COMPRESS_TIMEOUT_S=${COMPRESS_TIMEOUT_S:-900}
      - COMPRESS_CHUNK_CHARS=${COMPRESS_CHUNK_CHARS:-12000}
      - COMPRESS_MAX_MB=${COMPRESS_MAX_MB:-20}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SYNTHESIS_MODEL=${SYNTHESIS_MODEL:-gemini-2.5-pro}
      - AUTO_SUMMARY=${AUTO_SUMMARY:-true}
      - AUTO_SUMMARY_HOUR=${AUTO_SUMMARY_HOUR:-3}
      - NIGHTLY_BOOTSTRAP=${NIGHTLY_BOOTSTRAP:-true}
      - NIGHTLY_BOOTSTRAP_MAX=${NIGHTLY_BOOTSTRAP_MAX:-5}
      - WEEKLY_SYNTHESIS=${WEEKLY_SYNTHESIS:-true}
      - WEEKLY_SYNTHESIS_DAY=${WEEKLY_SYNTHESIS_DAY:-sun}
      - WEEKLY_SYNTHESIS_HOUR=${WEEKLY_SYNTHESIS_HOUR:-4}
      - CONTEXT_VERIFY_REPAIRS=${CONTEXT_VERIFY_REPAIRS:-1}
# No named volumes: the app is stateless. Everything lives in the vault.
